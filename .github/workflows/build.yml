name: Build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
        preset: [debug, release, dev]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build libasound2-dev libx11-dev libxext-dev libxinerama-dev
          libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev
          libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Focused checks
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      - uses: actions/setup-python@v5
        if: matrix.preset == 'dev'
        with:
          python-version: '3.11'
      - name: Watcher checks
        if: matrix.preset == 'dev'
        run: python tests/development/test_dev.py
      - name: Smoke check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a build/${{ matrix.preset }}/Opentone_artefacts/${{ matrix.preset == 'release' && 'Release' || 'Debug' }}/Opentone --smoke-test
      - name: Smoke check (macOS)
        if: runner.os == 'macOS'
        run: build/${{ matrix.preset }}/Opentone_artefacts/${{ matrix.preset == 'release' && 'Release' || 'Debug' }}/Opentone.app/Contents/MacOS/Opentone --smoke-test
      - name: Smoke check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $configuration = if ('${{ matrix.preset }}' -eq 'release') { 'Release' } else { 'Debug' }
          $process = Start-Process "build/${{ matrix.preset }}/Opentone_artefacts/$configuration/Opentone.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          exit $process.ExitCode
      - uses: actions/upload-artifact@v4
        if: matrix.preset != 'dev'
        with:
          name: Opentone-${{ matrix.os }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Opentone_artefacts/
